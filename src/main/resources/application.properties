spring.application.name=auth-service
server.port=8081

# Carga variables desde un archivo .env en la raiz de este servicio (auth-service/.env), si existe.
spring.config.import=optional:file:.env[.properties]

# Perfil activo por defecto: "dev" usa H2 en memoria (sin Neon).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:mi_secreto_super_largo_para_firmar_los_jwt_del_hotel_boutique_2026}
jwt.expiration-ms=86400000
